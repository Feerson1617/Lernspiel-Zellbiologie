name: Build and publish GitHub Pages

on:
  pull_request:
    branches: [main, feature/p02b-osmose-korrektor]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-spec.txt
      - run: npm ci
      - run: python -m pip install -r requirements-spec.txt
      - run: npx playwright install --with-deps chromium
      - run: node tools/check-m602-browser-split.ts
      - run: npm run check
      - run: npm run report:naming
      - run: npm run report:m602
      - run: npm run report:m602-r1
      - name: Report actual build-gate counts
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const suite of ['unit', 'content', 'build', 'playwright']) {
            try {
              const r = JSON.parse(readFileSync(`qa/generated/${suite}.json`, 'utf8'));
              const stats = r.stats ?? { passed: r.numPassedTests, failed: r.numFailedTests, pending: r.numPendingTests, total: r.numTotalTests };
              console.log(`::notice title=Actual ${suite} results::${JSON.stringify({ prHead: process.env.PR_HEAD_SHA, executionSha: process.env.GITHUB_SHA, suite, ...stats })}`);
              if (suite === 'playwright') writeFileSync('qa/generated/chromium-r1-evidence.json', JSON.stringify({ ...r, filteredCases: 'R1 details only; stats describe the full suite', prHead: process.env.PR_HEAD_SHA, executionSha: process.env.GITHUB_SHA, suites: r.suites.filter(s => s.file.endsWith('p03b-r1.spec.ts')) }));
              if (suite === 'playwright') writeFileSync('qa/generated/chromium-m604-evidence.json', JSON.stringify({ ...r, filteredCases: 'M6.04 and R2 details only; stats describe the full suite', prHead: process.env.PR_HEAD_SHA, executionSha: process.env.GITHUB_SHA, suites: r.suites.filter(s => /(?:m604-investigation|p03b-r2)\.spec\.ts$/.test(s.file)) }));
            } catch {
              console.log(`::warning title=Actual ${suite} unavailable::No completed report; not a pass.`);
            }
          }
          JS
      - name: Retain self-check reports and browser images (synthetic test data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-self-check
          path: |
            qa/generated/*.json
            test-results/**/*.png
      - name: Retain M7.02 evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m702-chromium
          retention-days: 7
          path: |
            qa/generated/playwright.json
            test-results/m702-*/**/*.png
            test-results/m702-*/**/*.json
            test-results/m702-*/**/trace.zip
            test-results/m702-*/**/error-context.md
      - name: Retain didactic V1 evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: didaktik-v1-chromium
          retention-days: 7
          path: |
            qa/generated/playwright.json
            test-results/didaktik-v1-*/**/*.png
            test-results/didaktik-v1-*/**/*.json
            test-results/didaktik-v1-*/**/trace.zip
            test-results/didaktik-v1-*/**/error-context.md
      - name: Retain targeted M10.02 R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1002-r1-chromium
          retention-days: 7
          path: |
            qa/generated/unit.json
            qa/generated/playwright.json
            test-results/m1002-r1-*/**/*.png
            test-results/m1002-r1-*/**/*.json
            test-results/m1002-r1-*/**/trace.zip
            test-results/m1002-r1-*/**/error-context.md
      - name: Retain compact Chromium R1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-r1-visual-evidence
          path: |
            qa/generated/chromium-r1-evidence.json
            test-results/p03b-r1-*/**/*.png
      - name: Retain synthetic Chromium failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-traces
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
      - name: Retain compact Chromium investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-m604-and-r2-evidence
          path: |
            qa/generated/chromium-m604-evidence.json
            test-results/m604-*/*.png
            test-results/p03b-r2-*/*.png
      - name: Upload only the inspected production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  webkit:
    if: github.event_name == 'pull_request'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-spec.txt
      - run: npx playwright install webkit
      - run: npm run build
        id: webkit_build
      - name: Native keyboard path preflight on macOS
        id: webkit_keyboard
        run: node tools/run-webkit-preflight.ts keyboard
      - name: Preserve original keyboard preflights before later suites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-keyboard-preflight
          retention-days: 7
          path: qa/generated/webkit-preflight/keyboard-*/
      - name: R1 paint and readability preflight on macOS
        if: ${{ !cancelled() && steps.webkit_build.outcome == 'success' }}
        run: node tools/run-webkit-preflight.ts r1
      - name: Preserve original R1 preflight before later suites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-r1-preflight
          retention-days: 7
          path: qa/generated/webkit-preflight/r1-*/
      - name: Compare a reproduced keyboard failure with the unchanged PR base
        if: ${{ !cancelled() && steps.webkit_keyboard.outcome == 'failure' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git init "$RUNNER_TEMP/webkit-preflight-base"
          git -C "$RUNNER_TEMP/webkit-preflight-base" fetch "$GITHUB_WORKSPACE" "$PR_BASE_SHA"
          git -C "$RUNNER_TEMP/webkit-preflight-base" checkout --detach FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/webkit-preflight-base/node_modules"
          cd "$RUNNER_TEMP/webkit-preflight-base"
          npm run build
          node "$GITHUB_WORKSPACE/tools/run-webkit-preflight.ts" keyboard-base "$GITHUB_WORKSPACE/qa/generated/webkit-preflight/base"
      - name: Preserve the unchanged-base comparison
        if: ${{ !cancelled() && steps.webkit_keyboard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: webkit-keyboard-preflight-base
          retention-days: 7
          path: qa/generated/webkit-preflight/base/
      - name: Three bounded unknown-input probes on Intel WebKit
        if: ${{ !cancelled() && steps.webkit_build.outcome == 'success' }}
        run: |
          node tools/check-m602-browser-split.ts
          for probe in 1 2 3; do
            WEBKIT_SUITE=m602-probe-$probe npx playwright test --config=playwright.webkit.config.ts tests/browser/m602-cued.spec.ts --grep 'M602-UNKNOWN-' --output=qa/generated/m602-probe-$probe-results || exit 1
          done
      - name: Retain all targeted probe reports and synthetic failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-m602-stability-probes
          retention-days: 7
          path: |
            qa/generated/webkit-m602-probe-*.json
            qa/generated/m602-browser-split.json
            qa/generated/m602-probe-*-results/**/trace.zip
            qa/generated/m602-probe-*-results/**/error-context.md
      - name: Complete WebKit suite (WEBKIT_SUITE=all)
        if: ${{ !cancelled() && steps.webkit_build.outcome == 'success' }}
        id: webkit_all
        continue-on-error: true
        env:
          WEBKIT_SUITE: all
        run: npx playwright test --config=playwright.webkit.config.ts
      - name: Report actual WebKit counts and retain a failed gate for any failed tests
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          let failed = false;
          for (const suite of ['all']) {
            try {
              const r = JSON.parse(readFileSync(`qa/generated/webkit-${suite}.json`, 'utf8'));
              const s = r.stats;
              const keyboard = [];
              const timings = [];
              const failedTests = [];
              function collect(value) {
                if (!value || typeof value !== 'object') return;
                if (value.name === 'keyboard-platform.json' && typeof value.body === 'string') {
                  keyboard.push(JSON.parse(Buffer.from(value.body, 'base64').toString('utf8')));
                }
                if (value.name === 'runtime-parity-timing.json' && typeof value.body === 'string') {
                  timings.push(JSON.parse(Buffer.from(value.body, 'base64').toString('utf8')));
                }
                if (typeof value.title === 'string' && Array.isArray(value.tests)) {
                  for (const test of value.tests) {
                    if (test.status === 'unexpected') {
                      failedTests.push({ title: value.title, file: value.file, project: test.projectName });
                    }
                  }
                }
                Object.values(value).forEach(collect);
              }
              collect(r.suites);
              const result = { prHead: process.env.PR_HEAD_SHA, executionSha: process.env.GITHUB_SHA, platform: process.platform, arch: process.arch, node: process.version, suite, ...s, keyboard, failedTests, timings };
              console.log(`::notice title=WebKit ${suite} actual results::${JSON.stringify(result)}`);
              writeFileSync('qa/generated/webkit-r1-evidence.json', JSON.stringify({ ...r, filteredCases: 'R1 details only; stats describe the full suite', prHead: process.env.PR_HEAD_SHA, executionSha: process.env.GITHUB_SHA, suites: r.suites.filter(s => s.file.endsWith('p03b-r1.spec.ts')) }));
              writeFileSync('qa/generated/webkit-m604-evidence.json', JSON.stringify({ ...r, filteredCases: 'M6.04 and R2 details only; stats describe the full suite', prHead: process.env.PR_HEAD_SHA, executionSha: process.env.GITHUB_SHA, suites: r.suites.filter(s => /(?:m604-investigation|p03b-r2)\.spec\.ts$/.test(s.file)) }));
              if (s.unexpected || s.skipped || s.flaky || r.errors?.length) failed = true;
            } catch (error) {
              failed = true;
              console.log(`::error title=WebKit ${suite} unavailable::${String(error)}`);
            }
          }
          if (failed) process.exit(1);
          JS
      - name: Retain M7.02 evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m702-webkit
          retention-days: 7
          path: |
            qa/generated/webkit-all.json
            test-results/m702-*/**/*.png
            test-results/m702-*/**/*.json
            test-results/m702-*/**/trace.zip
            test-results/m702-*/**/error-context.md
      - name: Retain actual WebKit reports and browser images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-self-check
          path: |
            qa/generated/webkit-*.json
            test-results/**/*.png
      - name: Retain didactic V1 evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: didaktik-v1-webkit
          retention-days: 7
          path: |
            qa/generated/webkit-all.json
            test-results/didaktik-v1-*/**/*.png
            test-results/didaktik-v1-*/**/*.json
            test-results/didaktik-v1-*/**/trace.zip
            test-results/didaktik-v1-*/**/error-context.md
      - name: Retain targeted M10.02 R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1002-r1-webkit
          retention-days: 7
          path: |
            qa/generated/webkit-all.json
            test-results/m1002-r1-*/**/*.png
            test-results/m1002-r1-*/**/*.json
            test-results/m1002-r1-*/**/trace.zip
            test-results/m1002-r1-*/**/error-context.md
      - name: Retain compact WebKit R1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-r1-visual-evidence
          path: |
            qa/generated/webkit-r1-evidence.json
            test-results/p03b-r1-*/**/*.png
      - name: Retain synthetic WebKit failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-failure-traces
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
      - name: Retain compact WebKit investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-m604-and-r2-evidence
          path: |
            qa/generated/webkit-m604-evidence.json
            test-results/m604-*/*.png
            test-results/p03b-r2-*/*.png

  current_relations_contract:
    name: Current M6.02 cued contract 1.0.0
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run report:m602-cued
      - name: Retain current outcomes, including any unmet expectations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-cued-contract
          path: |
            qa/generated/m602-cued-results.json

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
